name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 配布物を作るのは手元の build.sh で、ここでビルドするのは壊れていないかの
# 確認のため。バイナリはアクセスコードを持たない (実行時に隣の
# access_codes.txt を読む) ので、成果物に認証情報は入らない。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      # 手元は macOS なので、Windows・Linux 向けのクロスビルドが通ることを
      # ここで見ておく (console_windows.go はローカルのテストで通らない)。
      - name: Build
        run: |
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath -o "dist/patch_access_code-$3" .
          }
          build windows amd64 windows-x64.exe
          build windows arm64 windows-arm64.exe
          build windows 386   windows-x86.exe
          build darwin  arm64 macos-arm64
          build darwin  amd64 macos-x64
          build linux   amd64 linux-x86_64

      - name: Smoke test
        run: |
          dist/patch_access_code-linux-x86_64 --version
          printf '{\n    "user_access_code": {\n        "0EXIST1XXXXXXXX": "11111111"\n    }\n}\n' > "$RUNNER_TEMP/test.conf"
          printf '# comment\n0309FA5TESTAAAA 1a2b3c4d\n\n' \
            | dist/patch_access_code-linux-x86_64 "$RUNNER_TEMP/test.conf"
          grep -q '"0309FA5TESTAAAA": "1a2b3c4d"' "$RUNNER_TEMP/test.conf"
          grep -q '"0EXIST1XXXXXXXX": "11111111"' "$RUNNER_TEMP/test.conf"
