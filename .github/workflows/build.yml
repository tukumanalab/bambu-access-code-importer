name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# ここでビルドするのはアクセスコードを埋め込まない「貼り付け版」。
# ラボで配る埋め込み版は手元で build.sh を実行して作る (DEVELOPMENT.md 参照)。
# 公開リポジトリの Releases に認証情報が載らないよう、CI では埋め込まない。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          src=$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)
          echo "tag=$tag source=$src"
          test "$tag" = "$src"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" go build -trimpath -o "dist/patch_access_code-$3" .
          }
          build windows amd64 windows-x64.exe
          build windows arm64 windows-arm64.exe
          build windows 386   windows-x86.exe
          build darwin  arm64 macos-arm64
          build darwin  amd64 macos-x64
          build linux   amd64 linux-x86_64

      - name: Smoke test
        run: |
          dist/patch_access_code-linux-x86_64 --version
          printf '{\n    "user_access_code": {\n        "0EXIST1XXXXXXXX": "11111111"\n    }\n}\n' > "$RUNNER_TEMP/test.conf"
          printf '# comment\n0309FA5TESTAAAA 1a2b3c4d\n\n' \
            | dist/patch_access_code-linux-x86_64 "$RUNNER_TEMP/test.conf"
          grep -q '"0309FA5TESTAAAA": "1a2b3c4d"' "$RUNNER_TEMP/test.conf"
          grep -q '"0EXIST1XXXXXXXX": "11111111"' "$RUNNER_TEMP/test.conf"

      - uses: actions/upload-artifact@v4
        with:
          name: patch_access_code
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
